# Runs on every push and pull request. A red mark on GitHub means something broke.
name: Checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Game rules
        run: npm test
      - name: Code problems
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Browser tests
        run: npm run test:e2e
